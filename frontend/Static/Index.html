<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VietBee – Quản lý trang trại nuôi ong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="grp" aria-hidden="true"></div>
    <div class="logo" id="logo"></div>
    <div class="grp">
      <button class="ibtn" data-act="bell" aria-label="Thông báo" id="bellBtn"><span class="badge" id="badge"></span></button>
      <button class="ibtn" data-act="user" aria-label="Tài khoản" id="userBtn"></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim" data-act="close-all"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Chi tiết"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="bnav" id="bnav" aria-label="Điều hướng chính">
  <ul>
    <li><button class="bnav-item" data-go="home" aria-label="Tổng quát"><span data-ic="home"></span><span class="bnav-lb">Tổng quát</span></button></li>
    <li><button class="bnav-item" data-go="hives" aria-label="Quản lý trại"><span data-ic="farm"></span><span class="bnav-lb">Quản lý trại</span></button></li>
    <li><button class="bnav-item" data-act="cam" aria-label="Mở camera"><span data-ic="cam"></span><span class="bnav-lb">Camera</span></button></li>
    <li><button class="bnav-item" data-go="finance" aria-label="Tài chính"><span data-ic="wallet"></span><span class="bnav-lb">Tài chính</span></button></li>
    <li><button class="bnav-item" data-go="inventory" aria-label="Kho hàng"><span data-ic="box"></span><span class="bnav-lb">Kho hàng</span></button></li>
  </ul>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="App.js"></script>
</body>
</html>
