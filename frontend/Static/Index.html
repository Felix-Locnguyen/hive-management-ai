<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VietBee – Quản lý trang trại nuôi ong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EA; --bg2:#E1E5DC; --card:#FFFFFF; --soft:#F4F6F1; --ink:#1E231F; --muted:#626C64; --line:#DADFD5;
  --brand:#E58A1F; --brand-ink:#2B1A04;
  --ok:#23834F; --on-ok:#FFFFFF; --warn:#E8B900; --on-warn:#2A2000; --bad:#C93A3A; --on-bad:#FFFFFF;
  --nav-active:#16A34A; --nav-bg:rgba(255,255,255,.88);
  --c-blue:#4F7CA3; --c-brown:#8A6A3B;
  --r1:#4A3822; --r2:#8A6A3B; --r3:#B88A3E; --r4:#E3C27E; --r5:#8C9788; --r6:#C7CEC2;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141713; --bg2:#0D0F0C; --card:#1D211C; --soft:#252A23; --ink:#ECEFE8; --muted:#A0A99B; --line:#2F352C;
    --ok:#3FBF78; --on-ok:#05200F; --warn:#F0C419; --on-warn:#231A00; --bad:#EF6161; --on-bad:#2B0505;
    --nav-active:#3FBF78; --nav-bg:rgba(29,33,28,.88);
    --c-blue:#7FA7CC; --c-brown:#C49A55;
    --r1:#E6D3AE; --r2:#C49A55; --r3:#9C7434; --r4:#6F5326; --r5:#8F9B8A; --r6:#50584D;
  }
}
:root[data-theme="dark"]{
  --bg:#141713; --bg2:#0D0F0C; --card:#1D211C; --soft:#252A23; --ink:#ECEFE8; --muted:#A0A99B; --line:#2F352C;
  --ok:#3FBF78; --on-ok:#05200F; --warn:#F0C419; --on-warn:#231A00; --bad:#EF6161; --on-bad:#2B0505;
  --nav-active:#3FBF78; --nav-bg:rgba(29,33,28,.88);
  --c-blue:#7FA7CC; --c-brown:#C49A55;
  --r1:#E6D3AE; --r2:#C49A55; --r3:#9C7434; --r4:#6F5326; --r5:#8F9B8A; --r6:#50584D;
}
*{box-sizing:border-box}
html{background:var(--bg2);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;font:400 15px/1.45 var(--font);color:var(--ink);background:var(--bg2)}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;background:var(--brand);color:var(--brand-ink)}
.top .grp{display:flex}
.ibtn{width:44px;height:44px;border:0;background:transparent;color:inherit;border-radius:12px;display:grid;place-items:center;position:relative;cursor:pointer}
.ibtn:active{background:rgba(0,0,0,.1)}
.logo{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.badge{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:10px;font-weight:700;display:grid;place-items:center}
.badge:empty{display:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top :focus-visible{outline-color:var(--brand-ink)}
.ic{flex:none}

main{padding:16px 14px 104px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.pagehead{margin-bottom:12px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 8px 6px 0;margin:-6px 0 4px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:36px}

/* Blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.card h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hint{font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--ink);font-weight:700;font-size:13px;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--brand);text-decoration-thickness:2px;min-height:32px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;min-height:36px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.cats button[aria-pressed="true"]{background:#FBEFD5;border-color:#E8CF96;color:#B07A12}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.pager .btn:disabled{opacity:.4;cursor:default}
.cb{position:relative;height:190px;margin-top:10px}
.cb.sm{height:150px}
.empty{padding:18px 0;text-align:center;color:var(--muted);font-size:13px}

/* Environment strip */
.env{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.env-row{display:flex;justify-content:space-between;gap:8px}
.env-i{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.env-i .ic{color:var(--muted)}
.env-loc{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:12px}
.kpis.c3{grid-template-columns:repeat(3,1fr)}
.kpi{padding:12px 4px 10px;text-align:center;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .ic{color:var(--muted);margin-bottom:2px}
.kpi .v{font-weight:800;font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:11px;color:var(--muted);line-height:1.3;margin-top:1px}
.kpi .l .st{font-size:11px;font-weight:500;color:var(--muted);gap:4px}

/* Status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.st.ok i{background:var(--ok)} .st.warn i{background:var(--warn)} .st.bad i{background:var(--bad)}

/* Donut + legend */
.donut{display:flex;align-items:center;gap:14px;margin-top:10px}
.donut .cv{position:relative;width:128px;height:128px;flex:none}
.lg{list-style:none;margin:0;padding:0;flex:1;display:grid;gap:8px;font-size:13px;min-width:0}
.lg li{display:flex;align-items:center;gap:8px;min-width:0}
.lg .sw{width:10px;height:10px;border-radius:3px;flex:none}
.lg .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;padding-left:6px}
.lg .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Summary tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tile{background:var(--soft);border-radius:12px;padding:10px 12px}
.tile .v{font-weight:800;font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}

/* Fields */
.fld{display:grid;gap:4px;margin-top:10px}
.fld>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;width:100%}
textarea{min-height:68px;resize:vertical}
select{appearance:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:14px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{min-height:36px;width:auto;margin:0;font-size:13px;padding:0 12px;border-radius:10px}
.err{color:var(--bad);font-size:13px;font-weight:600;margin-top:8px;min-height:0}
.err:empty{display:none}

/* Chips / segmented */
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;min-height:32px;padding:0 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg.full{display:flex}.seg.full button{flex:1;min-height:40px}

/* Honeycomb matrix */
.zone{margin-top:14px}
.zone-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:6px}
.zone-h span{font-weight:500;color:var(--muted);font-size:12px}
.mx{container-type:inline-size;display:block;width:100%}
.hexrow{display:flex;margin-top:calc(-100cqw * .0444)}
.hexrow:first-child{margin-top:0}
.hexrow.odd{margin-left:calc(100cqw / 13)}
.hex{flex:none;width:calc(100cqw / 6.5);aspect-ratio:1/1.1547;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);border:0;padding:0;display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:.01em;cursor:pointer;position:relative;transform:scale(.92);transition:transform .12s,opacity .2s;font-variant-numeric:tabular-nums}
.hex:hover{transform:scale(.99)}
.hex.ok{background:var(--ok);color:var(--on-ok)}
.hex.warn{background:var(--warn);color:var(--on-warn)}
.hex.bad{background:var(--bad);color:var(--on-bad)}
.hex.bad::after,.hex.warn::after{position:absolute;top:15%;left:0;right:0;text-align:center;font-size:9px;line-height:1}
.hex.bad::after{content:"!"}
.hex.warn::after{content:"•"}
.hex.dim{opacity:.16;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}

/* List & tables */
.rows{display:grid;margin-top:6px}
.rowb{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.rowb:first-child{border-top:0}
.rowb .id{font-weight:800;font-variant-numeric:tabular-nums}
.rowb .m{font-size:12px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th button{border:0;background:none;padding:0;font:inherit;font-weight:600;color:inherit;cursor:pointer;display:inline-flex;gap:3px;align-items:center;min-height:30px}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .code{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .nm{font-weight:600}
.tbl .cat{font-size:11px;color:var(--muted)}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--soft)}
.tbl th.r{text-align:right}

/* Logs */
.log{list-style:none;margin:6px 0 0;padding:0}
.log li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.log li:first-child{border-top:0}
.log .d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.log .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.log .s{display:block;font-size:12px;color:var(--muted);font-weight:400}
.in{color:var(--ok)}.out{color:var(--bad)}

/* Hive detail */
.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:10px 0 0}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.cur{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cur div{background:var(--soft);border-radius:12px;padding:10px}
.cur .v{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.cur .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.cur .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.cur .v.bad{color:var(--bad)}.cur .v.warn{color:var(--on-warn)}
:root[data-theme="light"] .cur .v.warn{color:#8A6D00}
.alertbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--soft);border-left:4px solid var(--muted);font-size:14px}
.alertbar.bad{border-left-color:var(--bad)}.alertbar.warn{border-left-color:var(--warn)}
.det svg{width:100%;height:auto;display:block;border-radius:12px;margin-top:10px}
.qrbox{display:flex;gap:14px;align-items:center;margin-top:10px}
.qrimg{background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line);width:116px;height:116px;flex:none;display:grid;place-items:center}
.qrimg img,.qrimg canvas{width:100%!important;height:100%!important}
.qrmeta{min-width:0;font-size:13px}
.qrmeta code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);word-break:break-all;margin:2px 0 8px}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
/* Bottom navigation */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--nav-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav ul{list-style:none;margin:0 auto;padding:0;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr)}
.bnav li{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bnav-item{position:relative;width:100%;min-height:48px;min-width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 2px 7px;border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;transition:color .15s}
.bnav-item::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--nav-active);transition:transform .15s}
.bnav-item[aria-current="page"]{color:var(--nav-active)}
.bnav-item[aria-current="page"]::before{transform:translateX(-50%) scaleX(1)}
.bnav-item:active{opacity:.7}
.bnav-lb{font-size:11px;font-weight:600;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.sheet{position:fixed;left:50%;bottom:0;width:min(480px,100%);transform:translate(-50%,104%);background:var(--card);border-radius:20px 20px 0 0;z-index:60;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow:auto;transition:transform .22s ease;visibility:hidden;box-shadow:0 -1px 0 var(--line)}
.sheet.on{transform:translate(-50%,0);visibility:visible}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.nrow{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start;font-size:14px}
.nrow:first-of-type{border-top:0}
.nrow .st{margin-top:5px}
.nrow b{display:block}
.nrow span.m{color:var(--muted);font-size:12px}
/* Account */
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.prof{display:flex;gap:12px;align-items:center;margin-top:10px}
.prof .nm{font-weight:800;font-size:17px;letter-spacing:-.01em}
.prof .rl{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.prow{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px;min-height:48px}
.prow:first-of-type{border-top:0}
.prow .ic{color:var(--muted);flex:none}
.prow .m{display:block;font-size:12px;color:var(--muted)}
.prow .grow{min-width:0;flex:1}
.actrow{display:flex;gap:12px;align-items:center;width:100%;min-height:52px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.actrow:first-of-type{border-top:0}
.actrow b{font-weight:600;font-size:14px;display:block}
.actrow .m{font-size:12px;color:var(--muted);display:block}
.actrow .ch{margin-left:auto;color:var(--muted);flex:none}
.swt{width:44px;height:26px;border-radius:999px;background:var(--line);flex:none;position:relative;transition:background .15s;margin-left:auto}
.swt.on{background:var(--brand)}
.swk{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.swt.on .swk{transform:translateX(18px)}
.memav{width:36px;height:36px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.rolechip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.ver{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="grp" aria-hidden="true"></div>
    <div class="logo" id="logo"></div>
    <div class="grp">
      <button class="ibtn" data-act="bell" aria-label="Thông báo" id="bellBtn"><span class="badge" id="badge"></span></button>
      <button class="ibtn" data-act="user" aria-label="Tài khoản" id="userBtn"></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim" data-act="close-all"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Chi tiết"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="bnav" id="bnav" aria-label="Điều hướng chính">
  <ul>

  const R=rng(2026), now=Date.now(), out=[];
  const stages=[].concat(Array(12).fill('new'),Array(84).fill('grow'),Array(18).fill('soon'),Array(14).fill('done'));
  for(let i=stages.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=stages[i];stages[i]=stages[j];stages[j]=t}
  const AGE={new:[1,3],grow:[4,14],soon:[8,20],done:[12,24]};
  const W={new:()=>.15+R()*.15,grow:()=>.8+R()*.5,soon:()=>1.3+R()*.5,done:()=>1.4+R()*.5};
  const NOTES=[['Kiểm tra định kỳ','Đàn ổn định, chúa đẻ tốt','Anh Hùng'],['Cho ăn siro','1 lít siro đường 1:1','Chị Lan'],['Thay khung cầu','Thay 2 khung cầu mới','Anh Hùng'],['Xử lý Varroa','Acid oxalic, liều chuẩn','Chị Lan'],['Vệ sinh đáy thùng','Dọn xác ong, lau đáy','Anh Hùng']];
  let wsum=0;
  for(let n=1;n<=128;n++){
    const stage=stages[n-1], is=ISSUE[n], issue=is?is[0]:null;
    const ar=AGE[stage], age=ar[0]+Math.floor(R()*(ar[1]-ar[0]+1));
    let t=32.9+R()*1.8, h=56+R()*11, act=34+Math.floor(R()*13);
    if(issue){
      if(/Nhiệt độ cao nhẹ/.test(issue)) t=35+R()*.4;
      else if(/Nhiệt độ cao/.test(issue)) t=35.6+R()*.9;
      else if(/Nhiệt độ thấp nhẹ/.test(issue)) t=31.4+R()*.5;
      else if(/Nhiệt độ thấp/.test(issue)) t=29.8+R()*1.1;
      if(/Độ ẩm/.test(issue)) h=76+R()*8;
      if(/Hoạt động/.test(issue)) act=10+Math.floor(R()*7);
    }
    if(n===23){t=35.8;h=78}
    const w=W[stage]();wsum+=w;
    const hive={n:n,id:'VB-'+String(n).padStart(3,'0'),zone:ZONES[Math.floor((n-1)/32)],breed:BREEDS[Math.floor(R()*3)],stage:stage,age:age,
      created:now-age*30.4*864e5-Math.floor(R()*20)*864e5,t:r1(t),h:Math.round(h),act:act,
      status:is?is[1]:'ok',issue:issue,mins:is?is[2]:null,det:DET[n]||null,w:w,yield:0,hist:[]};
    const hist=[];
    for(let k=0;k<5;k++){const nt=NOTES[(n+k)%5];hist.push({ts:now-(3+k*6+Math.floor(R()*3))*864e5,type:nt[0],note:nt[1],who:nt[2]})}
    hive.hist=hist;out.push(hive);
  }
  const scale=2840/wsum;let tot=0;
  out.forEach(h=>{h.yield=r1(h.w*scale);tot+=h.yield});
  out[127].yield=r1(out[127].yield+(2840-tot));
  out.forEach(h=>{
    if(h.stage==='soon'||h.stage==='done')h.hist.push({ts:now-9*864e5,type:'Thu hoạch',note:r1(h.yield*.4)+' kg mật',who:'Anh Hùng'});
    if(h.issue)h.hist.push({ts:now-h.mins*6e4,type:'Cảnh báo tự động',note:h.issue,who:'Hệ thống'});
    h.hist.sort((a,b)=>b.ts-a.ts);
  });
  return out;
})();

/* ---- Quản lý đàn ong ---- */
function hiveMatch(h){
  const f=state.hq,q=f.q.trim().toLowerCase();
  if(q&&!(h.id.toLowerCase().includes(q)||String(h.n)===q.replace(/\D/g,'')&&/\d/.test(q)))return false;
  if(f.status!=='all'&&h.status!==f.status)return false;
  if(f.zone!=='all'&&h.zone!==f.zone)return false;
  if(f.breed!=='all'&&h.breed!==f.breed)return false;
  if(f.age==='lt3'&&!(h.age<3))return false;
  if(f.age==='3-12'&&!(h.age>=3&&h.age<=12))return false;
  if(f.age==='gt12'&&!(h.age>12))return false;
  return true;
}
function hexBtn(h,dim){
  return `<button class="hex ${h.status}${dim?' dim':''}" data-act="hive-open" data-id="${h.n}" aria-label="${h.id}, khu ${h.zone}, ${h.t} độ C, ${ST[h.status]}" title="${h.id} · ${h.t}°C · ${h.h}%">${String(h.n).padStart(3,'0')}</button>`;
}
function matrixHTML(){
  const zs=ZONES.filter(z=>state.hq.zone==='all'||z===state.hq.zone);
  if(!HIVES.filter(hiveMatch).length)return '<div class="empty">Không có thùng nào khớp bộ lọc.</div>';
  return zs.map(z=>{
    const hs=HIVES.filter(h=>h.zone===z), prob=hs.filter(h=>h.status!=='ok').length;
    let rows='';
    for(let i=0;i<hs.length;i+=6){rows+=`<div class="hexrow${(i/6)%2?' odd':''}">${hs.slice(i,i+6).map(h=>hexBtn(h,!hiveMatch(h))).join('')}</div>`}
    return `<div class="zone"><div class="zone-h">Khu ${z}<span>${hs.length} thùng${prob?' · '+prob+' cần xem':''}</span></div><div class="mx">${rows}</div></div>`;
  }).join('');
}
function sortedHives(){
  const f=state.hq,o={bad:0,warn:1,ok:2};
  const a=HIVES.filter(hiveMatch);
  a.sort((x,y)=>f.sort==='created'?y.created-x.created:f.sort==='yield'?y.yield-x.yield:f.sort==='alert'?(o[x.status]-o[y.status])||(x.mins||1e9)-(y.mins||1e9):x.n-y.n);
  return a;
}
function listHTML(){
  const a=sortedHives();

  return `<div class="rows">${a.slice(0,40).map(h=>`<button class="rowb" data-act="hive-open" data-id="${h.n}"><span class="id">${h.id}</span><span><span class="m">Khu ${h.zone} · ${h.breed} · ${h.t}°C · ${h.h}%</span></span>${st(h.status)}</button>`).join('')}</div>${a.length>40?`<div class="hint" style="margin-top:8px">Hiển thị 40/${a.length} thùng. Dùng bộ lọc để thu hẹp.</div>`:''}`;

function series(h,range){
  const R=rng(h.n*97+(range==='24h'?1:range==='7d'?2:3));
  const n=range==='24h'?24:range==='7d'?28:30, step=range==='24h'?36e5:range==='7d'?6*36e5:864e5;
  const now=Date.now(),labels=[],T=[],H=[],m=Math.max(4,Math.round(n*.3));
  for(let i=0;i<n;i++){
    const d=new Date(now-(n-1-i)*step), diur=Math.sin((d.getHours()-6)/24*2*Math.PI)*.35;
    labels.push(range==='24h'?d2(d.getHours())+':00':range==='7d'?d2(d.getDate())+'/'+d2(d.getMonth()+1)+' '+d2(d.getHours())+'h':d2(d.getDate())+'/'+d2(d.getMonth()+1));
    let t=(h.status==='ok'?h.t:33.7)+diur+(R()-.5)*.3, hh=(h.status==='ok'?h.h:62)-diur*4+(R()-.5)*3;
    if(h.status!=='ok'&&i>=n-m){const w=(i-(n-m)+1)/m;t=t*(1-w)+h.t*w;hh=hh*(1-w)+h.h*w}
    T.push(r1(t));H.push(Math.round(hh));
  }
  T[n-1]=h.t;H[n-1]=h.h;
  return{labels:labels,T:T,H:H};
}
function setupHive(n){
  const h=HIVES[n-1];if(!h)return;
  const el=$('#qr');
  if(el&&typeof QRCode!=='undefined'){try{new QRCode(el,{text:'vietbee://hive/'+h.id,width:200,height:200,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}}
  else if(el){el.textContent=h.id}
  drawHiveChart(h);
  const wrap=$('#rYieldWrap');if(wrap)wrap.hidden=true;
}
function drawHiveChart(h){
  const s=series(h,state.range), muted=css('--muted'), line=css('--line');
  charts.filter(c=>c.canvas&&c.canvas.id==='chHive').forEach(c=>c.destroy());

      y:{position:'left',suggestedMin:30,suggestedMax:38,grid:{color:line},border:{display:false},ticks:{color:muted,font:{size:10},maxTicksLimit:5}},
      y1:{position:'right',suggestedMin:40,suggestedMax:90,grid:{drawOnChartArea:false},border:{display:false},ticks:{color:muted,font:{size:10},maxTicksLimit:5}}}});
  mk('chHive',{type:'line',data:{labels:s.labels,datasets:[

}

function exportCSV(){
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const rows=[];
  rows.push(['VietBee – Xuất dữ liệu','Ngày xuất: '+isoDay(Date.now())]);
  rows.push([]);
  rows.push(['PHAN 1: DANH SACH THUNG ONG']);
  rows.push(['Mã','Khu','Giống','Giai đoạn','Tuổi (tháng)','Nhiệt độ (°C)','Độ ẩm (%)','Hoạt động (/phút)','Trạng thái','Vấn đề','Sản lượng (kg)']);
  HIVES.forEach(h=>rows.push([h.id,h.zone,h.breed,STAGE[h.stage],h.age,h.t,h.h,h.act,ST[h.status],h.issue||'',h.yield]));
  rows.push([]);
  rows.push(['PHAN 2: TON KHO']);
  rows.push(['Mã','Tên hàng','Loại','Số lượng','Đơn vị','Ngưỡng nhắc','Đơn giá (VNĐ)','Giá trị (VNĐ)','Trạng thái']);
  ITEMS.forEach(i=>rows.push([i.code,i.name,i.cat,i.qty,i.unit,i.min,i.price,i.qty*i.price,STOCK_LABEL[stockSt(i)]]));
  rows.push([]);
  rows.push(['PHAN 3: GIAO DICH']);
  rows.push(['Ngày','Loại','Danh mục','Mô tả','Số tiền (triệu VNĐ)']);
  TXNS.slice().sort((a,b)=>day(b.date)-day(a.date)).forEach(t=>rows.push([t.date,t.type==='in'?'Thu':'Chi',t.cat,t.desc,t.amt]));
  const csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download='vietbee_'+isoDay(Date.now())+'.csv';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},0);
  toast('Đã xuất tệp CSV');
}

document.addEventListener('click',function(e){

    case 'inv-page':{const f=state.inv,pages=Math.max(1,Math.ceil(invFiltered().length/INV_PAGE));f.page=t.dataset.p==='prev'?Math.max(1,f.page-1):Math.min(pages,f.page+1);$('#invList').innerHTML=invListHTML();const el=$('#invList');if(el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});break}

  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(f==='q'){state.hq.q=e.target.value;updateHiveView()}
  else if(f==='iq'){state.inv.q=e.target.value;state.inv.page=1;$('#invList').innerHTML=invListHTML()}
});
document.addEventListener('change',function(e){
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  const v=e.target.value;
  if(f==='zone'||f==='breed'||f==='age'){state.hq[f]=v;updateHiveView()}
  else if(f==='sort'){state.hq.sort=v;if(v!=='id')state.hq.view='list';updateHiveView()}
  else if(f==='ist'){state.inv.st=v;state.inv.page=1;$('#invList').innerHTML=invListHTML()}
  else if(f==='iitem'){state.inv.pre=v;const p=$('#iPrice');if(p)p.value=byCode(v).price;const l=p&&p.previousElementSibling;if(l)l.textContent='Giá nhập (VNĐ / '+byCode(v).unit+')'}
  else if(f==='rtype'){const w=$('#rYieldWrap');if(w)w.hidden=v!=='Thu hoạch'}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});

/* ================= Actions ================= */
function whenOf(dateStr){return dateStr===isoDay(Date.now())?Date.now():day(dateStr)}
function saveRecord(){
  const h=HIVES[state.route.id-1],type=$('#rType').value,note=$('#rNote').value.trim(),date=$('#rDate').value,y=parseFloat($('#rYield').value),err=$('#rErr');
  if(!date){err.textContent='Chọn ngày ghi nhận.';return}
  let text=note||'Không có ghi chú';
  if(type==='Thu hoạch'){
    if(!(y>0)){err.textContent='Nhập sản lượng lớn hơn 0 kg.';return}
    text=y+' kg mật'+(note?' · '+note:'');h.yield=r1(h.yield+y);
  }
  h.hist.unshift({ts:whenOf(date),type:type,note:text,who:'Bạn'});h.hist.sort((a,b)=>b.ts-a.ts);
  err.textContent='';toast('Đã lưu ghi nhận');
  render();
}
function saveTxn(){
  const amt=parseFloat($('#fAmt').value),date=$('#fDate').value,cat=$('#fCat').value,desc=$('#fDesc').value.trim(),err=$('#fErr'),type=state.fin.type;
  if(!date){err.textContent='Chọn ngày giao dịch.';return}
  if(!(amt>0)){err.textContent='Nhập số tiền lớn hơn 0.';return}
  const m=new Date(date+'T08:00:00').getMonth(), arr=type==='in'?DATA.revenue:DATA.expense;
  arr[m]=r1((arr[m]||0)+amt);
  if(type==='out')DATA.expCat[cat]=r1((DATA.expCat[cat]||0)+amt);
  if(type==='in'&&DATA.expense[m]==null)DATA.expense[m]=0;
  if(type==='out'&&DATA.revenue[m]==null)DATA.revenue[m]=0;
  TXNS.push({date:date,type:type,cat:cat,desc:desc||cat,amt:amt});
  toast(type==='in'?'Đã lưu khoản thu':'Đã lưu khoản chi');
  render();
}
function saveStock(){
  const f=state.inv,t=f.tab,it=byCode($('#iItem').value),qty=parseInt($('#iQty').value,10),date=$('#iDate').value,err=$('#iErr');
  if(!(qty>0)){err.textContent='Nhập số lượng lớn hơn 0.';return}
  if(!date){err.textContent='Chọn ngày.';return}
  let note='';
  if(t==='out'){
    if(qty>it.qty){err.textContent='Không đủ hàng: '+it.name+' chỉ còn '+n0(it.qty)+' '+it.unit+'.';return}
    const who=$('#iWho').value.trim();note=$('#iWhy').value+(who?' · '+who:'');it.qty-=qty;
  }else{
    const price=parseInt($('#iPrice').value,10),sup=$('#iSup').value.trim();
    if(price>=0)it.price=price;note=sup?'NCC: '+sup:'';it.qty+=qty;
  }
  INV_LOG.push({ts:whenOf(date),t:t,code:it.code,qty:qty,note:note});
  f.pre=it.code;
  toast(t==='in'?'Đã nhập kho':'Đã xuất kho');
  render();
}

/* ================= Init ================= */
$('#bellBtn').insertAdjacentHTML('afterbegin',ic('bell',22));
$('#userBtn').insertAdjacentHTML('afterbegin',ic('user',22));
$('#logo').innerHTML=logoMark()+'VietBee';
$$('#bnav [data-ic]').forEach(el=>{el.innerHTML=ic(el.dataset.ic,24)});
if(window.matchMedia){const mq=matchMedia('(prefers-color-scheme: dark)');const h=()=>{if(state.theme==='auto')render()};if(mq.addEventListener)mq.addEventListener('change',h)}
render();
})();
</script>
